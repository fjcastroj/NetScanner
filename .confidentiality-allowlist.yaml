#
# Exceptions for scripts/check_confidentiality.py. Each entry allows one exact
# value (no wildcards) in the listed files only, and needs a reason. Entries
# that no longer match anything are reported as stale. `paths` may use globs
# so that an entry keeps working after `openspec archive` moves a spec.

entries:
  - value: "10.0.0.0/8"
    paths: &range-docs
      - "openspec/**/data-confidentiality/spec.md"
      - "docs/confidentiality.md"
    reason: Names a forbidden private block in CIDR notation; not a host.
  - value: "172.16.0.0/12"
    paths: *range-docs
    reason: Names a forbidden private block in CIDR notation; not a host.
  - value: "192.168.0.0/16"
    paths: *range-docs
    reason: Names a forbidden private block in CIDR notation; not a host.
  - value: "fc00::/7"
    paths: *range-docs
    reason: Names the forbidden IPv6 unique local block; not a host.
  - value: "fe80::/10"
    paths: *range-docs
    reason: Names the forbidden IPv6 link-local block; not a host.
  - value: "10.0.0.0/8"
    paths: ["backend/tests/test_scope.py"]
    reason: A private block named as a range the lab-only guard must refuse; not a host.
  - value: "224.0.0.1"
    paths: ["backend/tests/test_scope.py"]
    reason: Synthetic IPv4 multicast address in a test that special addresses are never queried.
  - value: "239.255.255.250"
    paths: ["backend/tests/test_scope.py"]
    reason: Synthetic IPv4 multicast address in a test that special addresses are never queried.
  - value: "ff05::2"
    paths: ["backend/tests/test_scope.py"]
    reason: Synthetic IPv6 multicast address in a test that special addresses are never queried.
  - value: "169.254.10.20"
    paths: ["backend/tests/test_scope.py"]
    reason: Synthetic IPv4 link-local address in a test that special addresses are never queried.
  - value: "fe80::1"
    paths: ["backend/tests/test_scope.py"]
    reason: Synthetic IPv6 link-local address in a test that special addresses are never queried.
