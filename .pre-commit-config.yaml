# Computer Engineering, Universidad Internacional de La Rioja (UNIR).
#
# Install once with `pre-commit install`. Never bypass with --no-verify:
# see docs/confidentiality.md.

repos:
  - repo: local
    hooks:
      - id: confidentiality
        name: confidentiality check
        entry: python scripts/check_confidentiality.py
        language: python
        additional_dependencies: ["pyyaml>=6"]
        types: [text]
      - id: licence-headers
        name: licence header check
        entry: python scripts/check_headers.py
        language: python
        types: [text]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format
