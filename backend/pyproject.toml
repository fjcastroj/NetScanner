[project]
name = "netscanner"
version = "0.1.0"
description = "SNMP-based discovery, inventory, topology and monitoring of enterprise networks"
license = "Apache-2.0"
authors = [{ name = "Francisco Javier Castro Jiménez" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "argon2-cffi==25.1.0",
    "asyncpg>=0.32",
    "cryptography>=50.0.2",
    "fastapi>=0.162",
    "pydantic-settings>=2.16",
    "pysnmp==7.1.32",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-timeout>=2.4",
    "pyyaml>=6",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: needs a PostgreSQL server (see tests/conftest.py)",
    "lab: needs the snmpsim lab (see tests/conftest.py)",
]
# A hanging test fails with a stack dump instead of blocking CI.
timeout = 60
timeout_method = "thread"
