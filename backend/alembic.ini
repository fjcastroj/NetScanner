# Alembic configuration for developer use (`uv run alembic ...`). The database
# URL is never written here: migrations/env.py builds it from the
# NETSCANNER_* settings. Services run migrations with `python -m netscanner.migrate`.
[alembic]
script_location = %(here)s/src/netscanner/migrations
file_template = %%(rev)s_%%(slug)s
