#
# Single-server deployment (RNF-09). Copy .env.example to .env, replace the
# "change-me" secrets and run `docker compose up -d`. Only `web` publishes a
# port, on NETSCANNER_WEB_BIND (default 127.0.0.1:8080).

name: netscanner

x-backend-env: &backend-env
  NETSCANNER_SECRET_KEY: ${NETSCANNER_SECRET_KEY:?set NETSCANNER_SECRET_KEY in .env}
  NETSCANNER_DB_PASSWORD: ${NETSCANNER_DB_PASSWORD:?set NETSCANNER_DB_PASSWORD in .env}
  NETSCANNER_DB_HOST: db
  NETSCANNER_DB_PORT: "5432"
  NETSCANNER_DB_NAME: ${NETSCANNER_DB_NAME:-netscanner}
  NETSCANNER_DB_USER: ${NETSCANNER_DB_USER:-netscanner}
  NETSCANNER_DB_CONNECT_TIMEOUT: ${NETSCANNER_DB_CONNECT_TIMEOUT:-5}
  NETSCANNER_LOG_LEVEL: ${NETSCANNER_LOG_LEVEL:-INFO}
  NETSCANNER_STALE_AFTER: ${NETSCANNER_STALE_AFTER:-P7D}
  NETSCANNER_SNMP_TIMEOUT: ${NETSCANNER_SNMP_TIMEOUT:-3}
  NETSCANNER_SNMP_RETRIES: ${NETSCANNER_SNMP_RETRIES:-1}
  NETSCANNER_SNMP_MAX_REPETITIONS: ${NETSCANNER_SNMP_MAX_REPETITIONS:-25}
  NETSCANNER_SNMP_MAX_ROWS: ${NETSCANNER_SNMP_MAX_ROWS:-200000}
  NETSCANNER_SNMP_MAX_DEVICES: ${NETSCANNER_SNMP_MAX_DEVICES:-8}
  NETSCANNER_DISCOVERY_MAX_DEPTH: ${NETSCANNER_DISCOVERY_MAX_DEPTH:-5}
  NETSCANNER_DISCOVERY_MAX_CANDIDATES: ${NETSCANNER_DISCOVERY_MAX_CANDIDATES:-4096}
  NETSCANNER_DISCOVERY_MAX_DEVICES: ${NETSCANNER_DISCOVERY_MAX_DEVICES:-256}
  NETSCANNER_DISCOVERY_MAX_DATAGRAMS: ${NETSCANNER_DISCOVERY_MAX_DATAGRAMS:-50000}

x-backend: &backend
  build: ./backend
  image: netscanner-backend:local
  environment: *backend-env
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    image: postgres:17-alpine
    user: postgres
    environment:
      POSTGRES_DB: ${NETSCANNER_DB_NAME:-netscanner}
      POSTGRES_USER: ${NETSCANNER_DB_USER:-netscanner}
      POSTGRES_PASSWORD: ${NETSCANNER_DB_PASSWORD:?set NETSCANNER_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -q -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["python", "-m", "netscanner.migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    environment:
      <<: *backend-env
      # The Secure cookie check and the allowed origins (add-admin-authentication D3, D6).
      NETSCANNER_WEB_BIND: ${NETSCANNER_WEB_BIND:-127.0.0.1:8080}
      NETSCANNER_SESSION_IDLE: ${NETSCANNER_SESSION_IDLE:-PT8H}
      NETSCANNER_SESSION_MAX_AGE: ${NETSCANNER_SESSION_MAX_AGE:-PT24H}
      NETSCANNER_SESSION_COOKIE_SECURE: ${NETSCANNER_SESSION_COOKIE_SECURE:-true}
      NETSCANNER_PUBLIC_ORIGIN: ${NETSCANNER_PUBLIC_ORIGIN:-}
    command: ["python", "-m", "netscanner.api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The slim image has no curl; urlopen raises on any non-2xx answer.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  collector:
    <<: *backend
    command: ["python", "-m", "netscanner.collector"]
    environment:
      <<: *backend-env
      NETSCANNER_COLLECTOR_CHECK_INTERVAL: ${NETSCANNER_COLLECTOR_CHECK_INTERVAL:-10}
      NETSCANNER_COLLECTOR_POLL_INTERVAL: ${NETSCANNER_COLLECTOR_POLL_INTERVAL:-2}
      NETSCANNER_COLLECTOR_HEARTBEAT_FILE: /tmp/netscanner-collector.heartbeat
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The loop touches the heartbeat at least every 30 s (maximum backoff).
      test:
        - CMD
        - python
        - -m
        - netscanner.collector.healthcheck
        - /tmp/netscanner-collector.heartbeat
        - "90"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s
    restart: unless-stopped

  web:
    build: ./frontend
    image: netscanner-web:local
    ports:
      - "${NETSCANNER_WEB_BIND:-127.0.0.1:8080}:8080"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  db-data:
