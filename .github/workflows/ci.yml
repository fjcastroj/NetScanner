# CI (design D14): backend, frontend, repository checks and the stack test.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: netscanner
          POSTGRES_USER: netscanner
          POSTGRES_PASSWORD: ci-only-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netscanner -d netscanner"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NETSCANNER_TEST_DB_HOST: 127.0.0.1
      NETSCANNER_TEST_DB_PORT: "5432"
      NETSCANNER_TEST_DB_PASSWORD: ci-only-test-password
      NETSCANNER_TEST_REQUIRE_DB: "1"
      NETSCANNER_TEST_REQUIRE_LAB: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Lab simulator tools (pinned, separate from the project)
        run: >-
          uv run --no-project --python 3.12
          --with-requirements ../lab/snmpsim/requirements.txt
          snmpsim-command-responder --help > /dev/null
      - run: uv run ruff check ..
      - run: uv run ruff format --check ..
      - run: uv run pytest -v
      - name: Tests of the repository scripts
        run: uv run pytest -v ../scripts/tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans the whole history
      - uses: astral-sh/setup-uv@v7
      - name: Licence headers
        run: uv run --no-project --python 3.12 python scripts/check_headers.py --all
      - name: Confidentiality
        run: uv run --no-project --python 3.12 --with "pyyaml>=6" python scripts/check_confidentiality.py --all
      - name: Secret scan (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --verbose /repo
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: OpenSpec
        run: npx --yes @fission-ai/openspec@1.5.0 validate --all --strict

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Stack test
        run: python3 scripts/stack_test.py
